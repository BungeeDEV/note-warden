name: Windows installer release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version from Cargo.toml, e.g. 1.2.0 (without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installer-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require current main and an unpublished version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Releases must run from main'; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" || { echo 'main has changed; start a new release run'; exit 1; }
          python3 scripts/release.py check
          python3 -c 'import os, tomllib; assert tomllib.load(open("Cargo.toml", "rb"))["package"]["version"] == os.environ["REQUESTED_VERSION"], "Requested version does not match Cargo.toml"'
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')
          if grep -Fxq -- "v$REQUESTED_VERSION" <<< "$published"; then
            echo 'This version is already published. Prepare a new version first.'
            exit 1
          fi

  checks:
    name: Release checks
    needs: preflight
    uses: ./.github/workflows/ci.yml

  windows:
    name: Signed installer and draft
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Release caches are isolated from PR builds and only saved after success.
          key: release-windows-x64-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Prepare official Minisign on the ephemeral runner
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'minisign-0.12-win64.zip'
          Invoke-WebRequest 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ine '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479') {
            throw 'Minisign archive checksum mismatch'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'minisign'
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          Join-Path $destination 'minisign-win64/x86_64' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify release key interoperability
        run: |
          minisign -Vm installer/release-key-check.txt -p installer/update-signing.pub -x installer/release-key-check.txt.minisig
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and sign installer
        env:
          SIGNING_KEY: ${{ secrets.NOTE_WARDEN_MINISIGN_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'Signing secret NOTE_WARDEN_MINISIGN_KEY is missing' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'note-warden-release.key'
          try {
            [IO.File]::WriteAllText($keyFile, $env:SIGNING_KEY, [Text.UTF8Encoding]::new($false))
            Remove-Item Env:SIGNING_KEY
            ./scripts/build-installer.ps1 -GitHubRepository $env:GITHUB_REPOSITORY -PublicKeyFile installer/update-signing.pub -SigningKeyFile $keyFile
          } finally {
            if (Test-Path -LiteralPath $keyFile) { Remove-Item -LiteralPath $keyFile -Force }
          }
      - name: Test first install, reinstall and uninstall
        run: ./scripts/test-installer.ps1
      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: note-warden-windows-installer
          path: target/installer/github/*
          if-no-files-found: error
          retention-days: 14
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1 -GitHubRepository $env:GITHUB_REPOSITORY
      - name: Save successful release cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

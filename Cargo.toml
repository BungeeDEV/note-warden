[package]
name = "note-warden"
version = "1.2.0"
edition = "2024"

[dependencies]
gpui-kit = "=0.9.1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-winrt-notification = "0.8.1"
tray-icon = "0.26.1"
global-hotkey = "0.10.0"
winreg = "0.56.0"
futures = "0.3.34"
ureq = "3.5.2"
minisign-verify = "0.3.0"
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Security"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0
